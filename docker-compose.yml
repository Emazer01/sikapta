version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sikapta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sikapta_ai
    ports:
      - "5432:5432"
    volumes:
      - sikapta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sikapta_pgdata:
    driver: local

